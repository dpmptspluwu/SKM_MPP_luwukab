<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tindak Lanjut SKM - MPP Luwu</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <!-- Menggunakan html2pdf untuk cetak dokumen resmi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar disederhanakan untuk fokus pada laporan -->
        <aside class="sidebar">
            <div class="brand-area">
                <div class="brand-text">
                    <h2>TINDAK LANJUT</h2>
                    <p>Evaluasi SKM</p>
                </div>
            </div>
            <nav class="nav-menu">
                <a href="admin.html" class="nav-item">Kembali ke Dashboard</a>
                <a href="#" class="nav-item active">Cetak Tindak Lanjut</a>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="topbar">
                <div class="header-titles">
                    <h1 class="page-title">Generator Laporan Tindak Lanjut</h1>
                    <p class="page-subtitle">Penyusunan rekomendasi perbaikan layanan secara otomatis berstandar KemenPAN-RB</p>
                </div>
            </header>

            <div class="section" style="max-width: 600px; margin-top: 20px;">
                <div class="section-title">Konfigurasi Cetak Laporan</div>
                <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 16px;">
                    <label style="font-size: 14px; font-weight: 600; color: var(--text-muted);">Pilih Instansi / Gerai Layanan:</label>
                    <select id="pilih-gerai-tl" style="padding: 12px 16px; border-radius: 8px; border: 2px solid #BFDBFE; font-family: inherit; font-size: 15px; font-weight: 700; background: #EFF6FF; color: var(--brand-primary); outline: none;">
                        <option value="">Memuat data gerai...</option>
                    </select>
                    
                    <button id="btn-cetak-tl" style="background: var(--brand-primary); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 800; font-size: 15px; cursor: pointer; transition: background 0.2s; margin-top: 10px;" disabled>
                        Tarik Data & Cetak Dokumen Resmi
                    </button>
                    <p id="status-tl" style="font-size: 13px; color: #D97706; font-weight: 600; display: none;">Sedang menganalisis kelemahan layanan dan menyusun resep solusi...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Script Eksekusi -->
    <script src="t_lanjut.js"></script>
</body>
</html>
